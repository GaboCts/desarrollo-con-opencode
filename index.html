<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diario de Estudio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Diario de Estudio</h1>
            <p class="subtitle">Registra tus sesiones y mantén tu hábito</p>
        </header>

        <!-- Sección de Racha y Estadísticas -->
        <section class="streak-section">
            <div class="streak-hero">
                <div class="streak-number-wrap">
                    <span id="streak-number">0</span>
                    <span class="fire-emoji">🔥</span>
                </div>
                <p class="streak-label">días de racha</p>
            </div>
            
            <div class="stats-row">
                <div class="stat">
                    <span class="stat-value" id="weekly-minutes">0</span>
                    <span class="stat-label">min esta semana</span>
                </div>
                <div class="stat">
                    <span class="stat-value" id="monthly-days">0</span>
                    <span class="stat-label">días este mes</span>
                </div>
                <div class="stat">
                    <span class="stat-value" id="best-streak-number">0</span>
                    <span class="stat-label">mejor racha</span>
                </div>
            </div>
        </section>

        <!-- Mapa de Calor -->
        <section class="heatmap-section">
            <h2>Mapa de calor</h2>
            <div class="heatmap-wrapper">
                <div class="heatmap-container">
                    <div class="heatmap-months" id="heatmap-months"></div>
                    <div class="heatmap-body">
                        <div class="heatmap-weekdays">
                            <span>L</span>
                            <span>M</span>
                            <span>X</span>
                            <span>J</span>
                            <span>V</span>
                            <span>S</span>
                            <span>D</span>
                        </div>
                        <div class="heatmap-grid" id="heatmap-grid"></div>
                    </div>
                </div>
                <div class="heatmap-legend">
                    <span>Menos</span>
                    <div class="legend-colors">
                        <div class="legend-cell" style="background-color: #ebedf0"></div>
                        <div class="legend-cell" style="background-color: #9be9a8"></div>
                        <div class="legend-cell" style="background-color: #40c463"></div>
                        <div class="legend-cell" style="background-color: #30a14e"></div>
                        <div class="legend-cell" style="background-color: #216e39"></div>
                    </div>
                    <span>Más</span>
                </div>
            </div>
        </section>

        <!-- Formulario de Registro -->
        <section class="form-section">
            <h2>Nueva sesión</h2>
            <form id="study-form">
                <div class="form-group">
                    <label for="date">Fecha</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <label for="subject">Tema</label>
                    <input type="text" id="subject" placeholder="¿Qué estudiaste?" required>
                </div>
                <div class="form-group">
                    <label for="minutes">Minutos</label>
                    <input type="number" id="minutes" min="1" placeholder="¿Cuánto tiempo?" required>
                </div>
                <button type="submit" class="btn-primary">Guardar sesión</button>
            </form>
        </section>

        <!-- Lista de Sesiones -->
        <section class="sessions-section">
            <h2>Historial</h2>
            <div id="sessions-list" class="sessions-list">
                <!-- Se llenará dinámicamente con JavaScript -->
            </div>
        </section>
    </div>

    <!-- Ventana emergente del mapa de calor -->
    <div class="heatmap-tooltip" id="heatmap-tooltip"></div>

    <script src="src/heat-map.js"></script>
    <script src="app.js"></script>
</body>
</html>
