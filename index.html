<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diario de Estudio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📖 Diario de Estudio</h1>
            <p>Registra tus sesiones y mantén tu hábito de estudio</p>
        </header>

        <!-- Sección de Racha -->
        <section class="streak-card">
            <h2>Racha Actual</h2>
            <div class="streak-display">
                <span id="streak-number">0</span>
                <span class="fire-emoji">🔥</span>
            </div>
            <p class="streak-subtitle">días consecutivos</p>
            <div class="best-streak">
                <span>Mejor racha: <strong id="best-streak-number">0</strong> 🏆</span>
            </div>
        </section>

        <!-- Sección de Resumen Semanal -->
        <section class="weekly-card">
            <h2>Esta Semana (Lunes - Domingo)</h2>
            <div class="weekly-display">
                <span id="weekly-minutes">0</span>
                <span class="weekly-unit">minutos</span>
            </div>
        </section>

        <!-- Formulario de Registro -->
        <section class="form-card">
            <h2>Registrar Sesión</h2>
            <form id="study-form">
                <div class="form-group">
                    <label for="date">Fecha:</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <label for="subject">Tema:</label>
                    <input type="text" id="subject" placeholder="Ej. Matemáticas, Programación..." required>
                </div>
                <div class="form-group">
                    <label for="minutes">Minutos:</label>
                    <input type="number" id="minutes" min="1" placeholder="Ej. 45" required>
                </div>
                <button type="submit" class="btn-primary">Guardar Sesión</button>
            </form>
        </section>

        <!-- Lista de Sesiones -->
        <section class="sessions-card">
            <h2>Historial de Sesiones</h2>
            <div id="sessions-list" class="sessions-list">
                <!-- Se llenará dinámicamente con JavaScript -->
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
